<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review</title>
<style>
  body { margin: 0; background: #050505; color: rgba(234,236,238,.9); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; font-weight: 600; }
  .label { color: rgba(234,236,238,.5); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 14px; }
  .card { border: 1px solid rgba(234,236,238,.15); border-radius: 12px; padding: 18px; margin: 18px 0; }
  .meta, .hint { color: rgba(234,236,238,.7); font-size: 14px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0; font: inherit; color: rgba(234,236,238,.7); }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; background: #0c0c0c; color: inherit; border: 1px solid rgba(234,236,238,.25); border-radius: 8px; padding: 10px; font: inherit; }
  button { font: inherit; border-radius: 999px; padding: 8px 18px; border: 1px solid rgba(234,236,238,.3); background: none; color: inherit; cursor: pointer; margin: 10px 10px 0 0; }
  button.gold { background: linear-gradient(rgb(205,178,126), rgb(168,142,94)); color: #050505; border: 0; }
  button:disabled { opacity: .4; cursor: default; }
  .err { color: rgb(222,160,150); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Founder stories waiting for review</h1>
  <div id="app"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/review/config.js"></script>
<script>
const app = document.getElementById('app')
const cfg = window.AXIOM_REVIEW || {}
const sb = window.supabase.createClient(cfg.url, cfg.anonKey)

// Every piece of founder text goes in with textContent, never as HTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag)
  Object.assign(n, props)
  n.append(...kids)
  return n
}
const show = (...kids) => app.replaceChildren(...kids)

async function api(method, path, body) {
  const { data } = await sb.auth.getSession()
  const res = await fetch(path, {
    method,
    headers: { Authorization: `Bearer ${data.session?.access_token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  })
  const json = await res.json().catch(() => ({}))
  return { ok: res.ok, status: res.status, json }
}

function card(o, list) {
  const err = el('div', { className: 'err' })
  const story = el('textarea', { maxLength: 1200, placeholder: 'Story' })
  const lesson = el('textarea', { maxLength: 300, placeholder: 'Lesson' })
  story.value = o.story || ''
  lesson.value = o.lesson || ''
  const buttons = []
  const busy = (on) => buttons.forEach((b) => { b.disabled = on })
  const run = (fn) => async () => {
    busy(true); err.textContent = ''
    try { await fn() } catch { err.textContent = 'Something went wrong. Try again.' }
    busy(false)
  }
  const draft = el('button', { textContent: 'Draft with model' })
  draft.onclick = run(async () => {
    const r = await api('POST', `/api/review/outcomes/${o.id}/draft`)
    if (!r.ok) { err.textContent = r.json.error || 'No draft.'; return }
    story.value = r.json.story; lesson.value = r.json.lesson
  })
  const decide = (decision) => run(async () => {
    const r = await api('POST', `/api/review/outcomes/${o.id}`, { decision, story: story.value, lesson: lesson.value })
    if (!r.ok) { err.textContent = r.json.error || 'Not saved.'; if (r.status === 409) c.remove(); return }
    c.remove()
    if (!list.children.length) list.append(el('p', { className: 'hint', textContent: 'Nothing waiting.' }))
  })
  const approve = el('button', { className: 'gold', textContent: 'Approve' })
  approve.onclick = decide('approve')
  const reject = el('button', { textContent: 'Reject' })
  reject.onclick = decide('reject')
  buttons.push(draft, approve, reject)
  const c = el('div', { className: 'card' },
    el('div', { className: 'meta', textContent: [o.created_at, o.stage, o.business_model, o.customer_market, o.outcome].filter(Boolean).join(' · ') }),
    el('div', { className: 'label', textContent: 'What the founder wrote (read only)' }),
    el('pre', { textContent: JSON.stringify(o.draft, null, 2) }),
    el('div', { className: 'label', textContent: 'Story' }), story,
    el('div', { className: 'label', textContent: 'Lesson' }), lesson,
    draft, approve, reject, err)
  return c
}

async function load() {
  const r = await api('GET', '/api/review/outcomes')
  if (!r.ok) return show(el('p', { className: 'hint', textContent: 'Not available.' }))
  const list = el('div')
  r.json.outcomes.forEach((o) => list.append(card(o, list)))
  if (!list.children.length) list.append(el('p', { className: 'hint', textContent: 'Nothing waiting.' }))
  show(list)
}

async function start() {
  const { data } = await sb.auth.getSession()
  if (data.session) return load()
  const b = el('button', { className: 'gold', textContent: 'Sign in with Google' })
  b.onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: `${location.origin}/review` } })
  show(b)
}
start()
</script>
</body>
</html>
