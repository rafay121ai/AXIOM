# Render Blueprint for the Axiom API (replaces Railway).
# One web service. Free plan for testing (Rafay, Nov 2): it sleeps after 15
# minutes without requests and takes about a minute to wake. The push scheduler
# ticks inside the process, so before EXPO_PUSH goes on, move to Starter (always
# on). Singapore sits next to the main Supabase project (ap-southeast-1).
# Secrets are `sync: false`: Render asks for them when the Blueprint is created,
# and they are typed into Render's dashboard, never stored in this repo.
services:
  - type: web
    name: axiom-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: https://zmzrrmqqxqzmmfovpqjt.supabase.co
      - key: VITE_KNOWLEDGE_SUPABASE_URL
        value: https://ecbcwyjvswgvbiicnynw.supabase.co
      # Off until the phone build exists (milestone 5), then set to "on".
      - key: EXPO_PUSH
        value: "off"
      # On (Rafay, Nov 9): a delete request waits a 7-day grace period, then the hourly check removes the founder.
      - key: ACCOUNT_DELETE
        value: "on"
      - key: FRONTEND_URL
        sync: false
      # Extra allowed origins, comma-separated. Set in the dashboard: https://axiom-founders.vercel.app (web app on Vercel, Nov 8).
      - key: FRONTEND_URLS
        sync: false
      # Comma-separated user ids (or confirmed emails) of test accounts: they skip the daily situation limit and the cost cap.
      - key: ADMIN_USER_IDS
        sync: false
      # The review page (/review): the public anon key for its sign-in, and the reviewers' user ids (comma-separated). Empty: the page is off (404).
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: REVIEWER_USER_IDS
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KNOWLEDGE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
